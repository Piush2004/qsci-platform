version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension for relational and time-series data
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: qsci_postgres
    environment:
      POSTGRES_USER: qsci_admin
      POSTGRES_PASSWORD: qsci_password
      POSTGRES_DB: qsci_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsci_admin -d qsci_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching, WebSockets pub/sub backplane, and Celery backend
  redis:
    image: redis:7-alpine
    container_name: qsci_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neo4j for Supply Chain Graph Modeling
  neo4j:
    image: neo4j:5-community
    container_name: qsci_neo4j
    environment:
      NEO4J_AUTH: neo4j/qsci_password
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "qsci_password", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
