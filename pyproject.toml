[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsci-core"
version = "0.1.0"
description = "QSCI shared engine: forecasting, optimization, risk, financial impact, confidence, evaluation"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["qsci_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
